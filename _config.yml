# GitHub Pages（Jekyll）の配信除外。
# ⚠ private リポでも Pages の配信は公開。除外しない限り誰でも URL で読める。
# このファイルは hp-factory の bin/publish-exclude.txt から生成している。
#   再生成: bin/site-dist.sh 14tsubo-menu --jekyll-config
#   手で足したい場合は publish-exclude.txt 側に足すこと（Cloudflare Pages と共通のため）
# 除外してはいけないもの: CNAME / robots.txt / *.html / css / js / images
exclude:
  - "*.md"
  - "*.py"
  - "*.gs"
  - "*.sh"
  - "*.toml"
  - "*.log"
  - "*.pptx"
  - "*.xlsx"
  - "*.docx"
  - "*.ai"
  - "*.psd"
  - "*.numbers"
  - "*.csv"
  - "**/*.md"
  - "**/*.py"
  - "**/*.gs"
  - "CLAUDE.md"
  - "NOTES.md"
  - "README.md"
  - "DESIGN_BRIEF.md"
  - "memory/"
  - "docs/"
  - "scripts/"
  - "gas/"
  - "intake.toml"
  - "intakes/"
  - "_material/"
  - "share/"
  - "_config.yml"
  - "tools/"
  - "tests/"
  - "requirements.txt"
  - "package.json"
  - "package-lock.json"
  - "node_modules/"
  - ".git/"
  - ".gitignore"
  - ".github/"
  - ".env"
  - ".env.*"
  - ".venv/"
  - ".claude/"
  - ".playwright-mcp/"
  - ".ruff_cache/"
  - ".pytest_cache/"
  - "__pycache__/"
  - ".DS_Store"
